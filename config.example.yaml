# ─────────────────────────────────────────────────────────────────────────────
# Family E-ink Dashboard – config.example.yaml
#
# Copy this file to config.yaml and fill in your own values.
# config.yaml is gitignored – never commit it (contains credentials).
# ─────────────────────────────────────────────────────────────────────────────

# Which data modules are active. Family V1 starts intentionally small.
features:
  weather: true
  calendar: true
  tasks: true
  school: false
  hsl: false
  waste: false
  electricity: false
  evaka: false

# Dashboard identity
dashboard:
  title: "PERHEEN NÄYTTÖ"

# REQUIRED for weather and legacy HSL routing
location:
  latitude: 60.1699
  longitude: 24.9384
  name: "Helsinki"

# ── Calendars ────────────────────────────────────────────────────────────────
# Add one or more private iCal links. Google Calendar:
# Settings → Integrate calendar → Secret address in iCal format.
calendars:
  - name: "Perhe"
    ical_url: "https://calendar.google.com/calendar/ical/YOUR_CALENDAR_ID/private-TOKEN/basic.ics"
  # - name: "Vanhemmat"
  #   ical_url: "https://calendar.google.com/calendar/ical/ANOTHER_ID/private-TOKEN/basic.ics"
  # - name: "Lapset"
  #   ical_url: "https://calendar.google.com/calendar/ical/CHILDREN_ID/private-TOKEN/basic.ics"

# ── School schedules / Wilma ────────────────────────────────────────────────
# Each child can have their own private Wilma iCalendar subscription URL.
# The URL is a secret: keep the real values only in config.yaml.
# Enable with features.school: true.
school_schedules:
  - name: "Lapsi 1"
    ical_url: "YOUR_FIRST_CHILD_WILMA_ICAL_URL"
  - name: "Lapsi 2"
    ical_url: "YOUR_SECOND_CHILD_WILMA_ICAL_URL"

# ── Wilma messages / school reminders MVP ───────────────────────────────────
# This is separate from the Wilma iCal schedule. The current phase can be tested
# with wilma_reminders_check.py but is not rendered on the dashboard yet.
# Keep real credentials ONLY in your local config.yaml and never commit/share it.
wilma_messages:
  provider: "live"
  base_url: "https://YOUR-WILMA.inschool.fi"
  username: "YOUR_WILMA_USERNAME"
  password: "YOUR_WILMA_PASSWORD"
  # Empty list = automatically use all children linked to the parent account.
  child_ids: []
  # Only recent message bodies are fetched each poll. Future reminders already
  # extracted from older messages remain in local state until they expire.
  limit_per_child: 20

# ── Family reminders ─────────────────────────────────────────────────────────
# V1 reads reminders directly from config.yaml. Later this module can be swapped
# to Google Tasks/Todoist without changing the renderer.
tasks:
  items:
    - "Liikuntakassi mukaan"
    - "Palauta kirjaston kirjat"
    - title: "Osta maitoa"
      done: false

# ── HSL stop/station departures (optional) ───────────────────────────────────
# Enable with features.hsl: true. Keep the API key only in config.yaml.
# stop_id accepts a Digitransit GTFS id with or without the HSL: prefix.
hsl:
  api_key: "your-digitransit-api-key"
  stops:
    - name: "Bussipysäkki"
      stop_id: "A1291112"
      type: "stop"
      departures: 3
    - name: "Juna Helsinkiin"
      stop_id: "A1000204"
      type: "station"
      mode: "RAIL"
      headsign_contains: "Helsinki"
      departures: 3

# ── Electricity / Caruna (legacy layout, optional) ──────────────────────────
# Enable with features.electricity: true and display.layout: legacy.
caruna:
  username: "your@email.com"
  password: "your-password"

# ── Waste schedule (legacy layout, optional) ────────────────────────────────
# Enable with features.waste: true and display.layout: legacy.
waste:
  collections:
    - type: "Sekajäte"
      interval_weeks: 2
      next_date: "2026-09-09"
    - type: "Biojäte"
      interval_weeks: 1
      next_date: "2026-09-09"

# ── Daycare / eVaka (legacy layout, optional) ───────────────────────────────
# Enable with features.evaka: true and display.layout: legacy.
evaka:
  username: "your@email.com"
  password: "your-password"
  base_url: "https://espoonvarhaiskasvatus.fi"

# ── Display ──────────────────────────────────────────────────────────────────
# Recommended family wall display: Waveshare 13.3inch e-Paper HAT (K), 960x680.
display:
  model: "waveshare_13in3k"
  width: 960
  height: 680
  rotation: 0
  layout: "family_13in3"

# For the original Waveshare 7.5inch V2, use instead:
# display:
#   model: "waveshare_7in5_v2"
#   width: 800
#   height: 480
#   rotation: 0
#   layout: "family"

# ── Partial updates ──────────────────────────────────────────────────────────
# Keep these off for waveshare_13in3k until partial refresh has been verified
# on the physical panel. The 7.5inch adapter supports them.
partial_updates:
  clock: false
  hsl: false

# ── Cache TTLs ───────────────────────────────────────────────────────────────
cache:
  ttl_minutes: 55
  school_ttl_minutes: 55
  wilma_messages_ttl_minutes: 30
  hsl_ttl_minutes: 10
  hsl_active_hours: [6, 22]
